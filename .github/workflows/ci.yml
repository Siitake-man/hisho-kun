name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    env:
      # Windows ランナーの既定エンコーディング (cp1252) でテスト出力の
      # 絵文字・日本語が UnicodeEncodeError にならないよう UTF-8 を強制
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout (全履歴取得 — git履歴機密スキャン用)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # llama_cpp_python は Windows のソースビルドが 10 分超になるため CI では除外。
          # 依存するテスト (test_local_llm_cache) は llama_cpp をスタブ注入して実行される。
          grep -v -E '^llama_cpp_python' requirements.txt > requirements-ci.txt
          if ! pip install -r requirements-ci.txt; then
            echo "::error::依存インストールに失敗しました (requirements の不整合/解決不能の疑い)"
            exit 1
          fi

      # 失敗テスト名を GitHub の「Annotations」欄へ ::error:: として出力する。
      # ログUIを開かなくても概要ページのスクリーンショットだけで原因が判別できる。
      - name: Run unit tests (unittest discover)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v *> unittest.log
          $exit = $LASTEXITCODE
          Get-Content unittest.log -Tail 40
          $failed = Select-String -Path unittest.log -Pattern '^(FAIL|ERROR): (.+)$'
          foreach ($m in $failed) {
            Write-Output "::error::テスト失敗: $($m.Matches[0].Groups[2].Value)"
          }
          # 例外の「型: メッセージ」行 (ImportError 等) を原因として要約表示する
          $details = Select-String -Path unittest.log -Pattern '^(ImportError|ModuleNotFoundError|FileNotFoundError|OSError|TclError|AssertionError|ValueError|TypeError|KeyError|RuntimeError): .+$' -AllMatches
          foreach ($d in ($details | Select-Object -First 8)) {
            Write-Output "::error::原因: $($d.Line.Trim())"
          }
          if ($failed.Count -gt 0) {
            # unittest は末尾に失敗のトレースバックをまとめて出すため、
            # その最終ブロックを Annotations へ転記する (ImportError の真因が1往復で判明)
            Get-Content unittest.log -Tail 30 | ForEach-Object { Write-Output "::error::LOG: $_" }
            Write-Output "::error::$($failed.Count) 件のテストが失敗しました"
            exit 1
          }
          exit $exit

      - name: Secret history scan (公開ゲート — 検出時はジョブ失敗)
        shell: pwsh
        run: |
          python tools/scan_git_secrets.py *> scan.log
          $exit = $LASTEXITCODE
          Get-Content scan.log
          if ($exit -ne 0) {
            Get-Content scan.log -Tail 25 | ForEach-Object { Write-Output "::error::機密スキャン: $_" }
            exit 1
          }

