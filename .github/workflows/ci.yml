name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. 構文チェック & 高速静的解析 (Fail-Fast: 秒速で SyntaxError や壊れたインポートを検知)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Bytecode compilation check (py_compile)
        run: |
          echo "=== Python バイトコード構文コンパイル検査 (全モジュール) ==="
          python -m compileall -q .

      - name: Run Ruff Linter
        run: |
          echo "=== Ruff による高速静的解析 (致命的エラー・未定義変数ブロック) ==="
          ruff check --select E9,F63,F7,F82 .

  # ---------------------------------------------------------------------------
  # 2. セキュリティ検査 (全コミット履歴の機密情報スキャン)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Git Secret History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (全履歴取得 — git履歴機密スキャン用)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Secret Scanner
        run: |
          python tools/scan_git_secrets.py

  # ---------------------------------------------------------------------------
  # 3. テスト実行マトリクス (Ubuntu + Windows × Python 3.11, 3.12, 3.13)
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }} / Py${{ matrix.python-version }})
    needs: [lint] # Lint が通過した場合のみ実行し、無駄なビルド・テスト時間を削減
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]
    env:
      # Windows ランナーでの絵文字・日本語の UnicodeEncodeError を防止
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install System Dependencies (Ubuntu - Xvfb & Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # llama_cpp_python は C/C++ ビルドに 10 分超かかるため CI では除外 (テスト側でスタブ注入済み)
          grep -v -E '^llama_cpp_python' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          pip install pytest

      - name: Run Tests on Ubuntu with Xvfb
        if: runner.os == 'Linux'
        run: |
          echo "=== Xvfb (Virtual Framebuffer) 仮想スクリーン上で pytest 実行 ==="
          xvfb-run -a pytest -v --tb=short

      - name: Run Tests on Windows
        if: runner.os == 'Windows'
        run: |
          echo "=== Windows デスクトップセッション上で pytest 実行 ==="
          pytest -v --tb=short
